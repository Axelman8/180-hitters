plugins { id 'com.android.application' }

def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingProperties.load(new FileInputStream(signingFile))
def releaseVersion = providers.gradleProperty('releaseVersion').orElse('1.8.68').get()
def releaseParts = releaseVersion.tokenize('.').collect { value -> value.replaceAll('[^0-9].*$', '').toInteger() }
while (releaseParts.size() < 3) releaseParts.add(0)
def releaseCode = releaseParts[0] * 1000000 + releaseParts[1] * 1000 + releaseParts[2]

android {
    namespace 'nl.axelman8.darts'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'nl.axelman8.darts'
        minSdk 26
        targetSdk 35
        versionCode releaseCode
        versionName releaseVersion
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets')
    sourceSets.main.assets.srcDir(generatedWebAssets)
    tasks.register('syncWebAssets', Sync) {
        from('../../dist') { exclude 'downloads/*.apk' }
        into(generatedWebAssets.map { it.dir('www') })
    }
    tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.core:core:1.15.0'
}
