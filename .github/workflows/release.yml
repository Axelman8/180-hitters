name: Publish 180 Hitters

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bundle Python and app
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Set-Content -Path .version -Value $version
          Set-Content -Path .desktop-platform -Value windows
          python -m PyInstaller --noconfirm --windowed --onedir --name DartsApp --paths . --distpath windows-build --workpath windows-work --add-data "dist;dist" --add-data ".version;." --add-data ".desktop-platform;." packaging/windows-launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed Windows application
        shell: pwsh
        run: python packaging/test-install.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/DartsApp-Setup-Windows-x64.exe

  release:
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/axelman8-release.jks
          {
            echo 'storeFile=keystore/axelman8-release.jks'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build Android app
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Assemble release packages
        shell: bash
        run: |
          mkdir -p dist/downloads release-payload linux-package windows-package
          cp android/app/build/outputs/apk/release/app-release.apk dist/downloads/180-Hitters.apk
          sha256sum dist/downloads/180-Hitters.apk > 180-Hitters.apk.sha256
          cp -a dist server.py autodarts_bridge.py camera_research.py bluetooth-bridge.py nuc-update.py kiosk-control.py release-payload/
          printf '%s\n' "${GITHUB_REF_NAME#v}" > release-payload/.version
          tar -C release-payload -czf 180-hitters-nuc.tar.gz .
          sha256sum 180-hitters-nuc.tar.gz > 180-hitters-nuc.tar.gz.sha256
          cp -a dist server.py autodarts_bridge.py camera_research.py bluetooth-bridge.py nuc-update.py kiosk-control.py network-control.py system-control.py install-linux.sh install-network-control.sh install-system-control.sh setup-linux.sh INSTALLATION.txt linux-package/
          printf '%s\n' "${GITHUB_REF_NAME#v}" > linux-package/.version
          tar -C linux-package -czf 180-Hitters-Linux-x64.tar.gz .
          sha256sum 180-Hitters-Linux-x64.tar.gz > 180-Hitters-Linux-x64.tar.gz.sha256
          cp -a dist server.py autodarts_bridge.py camera_research.py install-windows.ps1 install-windows.cmd uninstall-windows.ps1 INSTALLATION.txt windows-package/
          printf '%s\n' "${GITHUB_REF_NAME#v}" > windows-package/.version
          (cd windows-package && zip -qr ../180-Hitters-Windows-x64.zip .)
          sha256sum 180-Hitters-Windows-x64.zip > 180-Hitters-Windows-x64.zip.sha256

      - name: Build and test Debian installer
        run: |
          python3 packaging/build-deb.py "${GITHUB_REF_NAME#v}"
          python3 packaging/build-deb.py "${GITHUB_REF_NAME#v}" --cameras
          python3 packaging/test-camera-setup.py
          python3 packaging/test-install.py linux
          xvfb-run -a /usr/bin/python3 packaging/test-camera-wizard-ui.py
          sha256sum 180-Hitters-NUC-Cameras-Ubuntu-amd64.deb > 180-Hitters-NUC-Cameras-Ubuntu-amd64.deb.sha256
          sha256sum DartsApp-Ubuntu-Debian-amd64.deb > DartsApp-Ubuntu-Debian-amd64.deb.sha256

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: .

      - name: Checksum Windows installer
        run: sha256sum DartsApp-Setup-Windows-x64.exe > DartsApp-Setup-Windows-x64.exe.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/downloads/180-Hitters.apk
          180-Hitters.apk.sha256
          180-hitters-nuc.tar.gz
          180-hitters-nuc.tar.gz.sha256
          180-Hitters-Linux-x64.tar.gz
          180-Hitters-Linux-x64.tar.gz.sha256
          180-Hitters-Windows-x64.zip
          180-Hitters-Windows-x64.zip.sha256
          DartsApp-Setup-Windows-x64.exe
          DartsApp-Setup-Windows-x64.exe.sha256
          DartsApp-Ubuntu-Debian-amd64.deb
          DartsApp-Ubuntu-Debian-amd64.deb.sha256
          180-Hitters-NUC-Cameras-Ubuntu-amd64.deb
          180-Hitters-NUC-Cameras-Ubuntu-amd64.deb.sha256
          packaging/CAMERA-INSTALLATIE.txt
          packaging/INSTALLER-HELP.txt
          --title "180 Hitters ${GITHUB_REF_NAME}"
          --generate-notes

